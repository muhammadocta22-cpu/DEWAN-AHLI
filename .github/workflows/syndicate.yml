name: syndicate

on:
  schedule:
    - cron: "*/30 * * * *"        # Hunter + tugas proaktif tiap 30 menit (repo WAJIB Public; kalau Private ganti ke "17 */3 * * *")
    - cron: "23 2 * * *"          # pemeriksa harian untuk keepalive
  repository_dispatch:
    types: [telegram_update]      # pesan Bos masuk lewat gateway Netlify
  workflow_dispatch:
    inputs:
      mode:
        description: "hunt | webhook | tick"
        default: "hunt"

permissions:
  contents: read

concurrency:
  group: syndicate
  cancel-in-progress: false       # jangan ada 2 sidang berebut memori

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: state
          key: syndicate-state-restore-${{ github.run_id }}
          restore-keys: |
            syndicate-state-

      - name: Jalankan Dewan
        run: python main.py "$MODE"
        env:
          MODE: ${{ github.event_name == 'repository_dispatch' && 'webhook' || github.event.inputs.mode || 'hunt' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HUNT_QUERIES: ${{ vars.HUNT_QUERIES }}
          ANOMALY_KEYWORDS: ${{ vars.ANOMALY_KEYWORDS }}
          PRICE_TARGETS: ${{ vars.PRICE_TARGETS }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          TRIAGE_MIN: ${{ vars.TRIAGE_MIN }}
          MAX_HUNT_SIDANG_PER_DAY: ${{ vars.MAX_HUNT_SIDANG_PER_DAY }}
          SCOUT_ENABLED: ${{ vars.SCOUT_ENABLED }}
          INISIATIF_ENABLED: ${{ vars.INISIATIF_ENABLED }}
          INISIATIF_JAM: ${{ vars.INISIATIF_JAM }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: syndicate-state-${{ github.run_id }}

  # Repo publik yang sepi 60 hari akan dimatikan jadwalnya oleh GitHub.
  # Job ini membuat satu commit kosong bila commit terakhir sudah lebih dari 40 hari.
  keepalive:
    if: github.event.schedule == '23 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Jaga jadwal Dewan tetap hidup
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((40*86400)) ]; then
            git config user.name "syndicate-bot"
            git config user.email "syndicate-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: jaga jadwal Dewan tetap aktif"
            git push
          fi
